<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Original Wellness</title>
  <meta name="description" content="Original Wellness is a premium wellness design consultancy in London: fitness, recovery and installation for commercial and residential clients.">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <header class="site-header">
    <a class="typemark" href="#top">Original Wellness</a>
    <!-- TODO: wire up when sections exist -->
    <nav class="menu" aria-label="Main">
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="block" aria-label="London">
      <picture>
        <source type="image/webp" sizes="100vw"
          srcset="assets/london-1280.webp 1280w, assets/london-1375.webp 1375w">
        <img src="assets/london.jpg" alt="The London signature sauna: dark thermo-treated wood, green glazed tiles and two-tier benches behind a glass front" width="1375" height="768" fetchpriority="high">
      </picture>
      <h2>London</h2>
    </section>
    <section class="block" aria-label="Milan">
      <picture>
        <source type="image/webp" sizes="100vw"
          srcset="assets/milan-1280.webp 1280w, assets/milan-1920.webp 1920w, assets/milan-2000.webp 2000w">
        <img src="assets/milan.jpg" alt="The Milan signature sauna: warm walnut-toned wood with a terracotta-tiled heater" width="2000" height="1116" loading="lazy">
      </picture>
      <h2>Milan</h2>
    </section>
    <section class="block" aria-label="Oslo">
      <picture>
        <source type="image/webp" sizes="100vw"
          srcset="assets/oslo-1280.webp 1280w, assets/oslo-1920.webp 1920w, assets/oslo-2000.webp 2000w">
        <img src="assets/oslo.jpg" alt="The Oslo signature sauna: pale alder walls and slatted thermo-aspen benches" width="2000" height="1116" loading="lazy">
      </picture>
      <h2>Oslo</h2>
    </section>
  </main>
</body>
</html>
